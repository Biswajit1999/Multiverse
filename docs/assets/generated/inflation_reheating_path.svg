<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1200"><rect width="2000" height="1200" fill="#fffdf8"/><g font-family="Georgia,serif" fill="#121826"><text x="95" y="105" font-size="58">From inflation to the hot Big Bang</text></g><text x="95" y="155" font-family="Arial,sans-serif" font-size="25" fill="#667085">A physical chain from pre-hot dynamics to observable relics</text><line x1="110" y1="210" x2="1890" y2="210" stroke="#cfd3db" stroke-width="3"/><g font-family="Arial,sans-serif"><g transform="translate(100 260)"><circle cx="35" cy="32" r="28" fill="#3157d5"/><text x="35" y="41" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text><text x="85" y="38" font-size="33" font-weight="700" fill="#121826">Slow-roll inflation</text><path d="M50 335C180 80 310 105 420 270" fill="none" stroke="#3157d5" stroke-width="8"/><circle cx="220" cy="145" r="14" fill="#3157d5"/><line x1="220" y1="145" x2="285" y2="230" stroke="#121826" stroke-width="4"/><text x="45" y="410" font-size="24" fill="#253247">Potential energy dominates</text><text x="45" y="450" font-size="23" fill="#667085">εᵥ, |ηᵥ| ≪ 1</text></g><g transform="translate(545 260)"><circle cx="35" cy="32" r="28" fill="#3157d5"/><text x="35" y="41" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text><text x="85" y="38" font-size="33" font-weight="700" fill="#121826">Quantum perturbations</text><path d="M40 230q35-60 70 0t70 0t70 0t70 0" fill="none" stroke="#1a8ca4" stroke-width="6"/><path d="M55 295q25-38 50 0t50 0t50 0t50 0" fill="none" stroke="#1a8ca4" stroke-width="6"/><text x="45" y="410" font-size="24" fill="#253247">Fluctuations exit the horizon</text><text x="45" y="450" font-size="23" fill="#667085">𝒫ᵣ(k) → nₛ, r</text></g><g transform="translate(1000 260)"><circle cx="35" cy="32" r="28" fill="#d78a20"/><text x="35" y="41" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text><text x="85" y="38" font-size="33" font-weight="700" fill="#121826">Reheating</text><path d="M55 145C80 25 110 395 140 120C165 15 195 380 225 150C255 80 285 325 320 170C340 125 375 285 410 190" fill="none" stroke="#d78a20" stroke-width="8"/><g fill="#d78a20"><circle cx="100" cy="325" r="12"/><circle cx="180" cy="285" r="10"/><circle cx="285" cy="335" r="12"/><circle cx="360" cy="285" r="11"/></g><text x="45" y="410" font-size="24" fill="#253247">Inflaton energy → particles</text><text x="45" y="450" font-size="23" fill="#667085">ρ̇R + 4HρR = Γρφ</text></g><g transform="translate(1450 260)"><circle cx="35" cy="32" r="28" fill="#3157d5"/><text x="35" y="41" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4</text><text x="85" y="38" font-size="33" font-weight="700" fill="#121826">Hot radiation era</text><rect x="50" y="110" width="380" height="265" rx="24" fill="#fff1d8" stroke="#e1b26d" stroke-width="4"/><g fill="#d78a20"><circle cx="110" cy="170" r="11"/><circle cx="190" cy="240" r="9"/><circle cx="335" cy="180" r="12"/></g><g fill="#1a8ca4"><circle cx="150" cy="315" r="10"/><circle cx="260" cy="165" r="11"/><circle cx="390" cy="280" r="9"/></g><text x="50" y="425" font-size="24" fill="#253247">Radiation dominates</text><text x="50" y="465" font-size="23" fill="#667085">p = ρ / 3</text></g></g><g transform="translate(100 825)" font-family="Arial,sans-serif"><rect width="1800" height="250" rx="28" fill="#f2f4f8"/><text x="45" y="52" font-size="22" font-weight="700" fill="#3157d5">OBSERVABLE AFTERMATH</text><path d="M60 155H1740" stroke="#aeb5c0" stroke-width="6"/><g fill="#3157d5"><circle cx="210" cy="155" r="14"/><circle cx="630" cy="155" r="14"/><circle cx="1050" cy="155" r="14"/><circle cx="1470" cy="155" r="14"/></g><g font-size="24" fill="#253247"><text x="140" y="115">Primordial spectrum</text><text x="575" y="115">CMB anisotropy</text><text x="1000" y="115">Galaxies</text><text x="1400" y="115">Cosmic web</text></g></g></svg>