[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "multiverse-cosmology-lab"
version = "0.1.0"
description = "Research and numerical experiments in early-universe and multiverse cosmology."
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4.2",
  "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
