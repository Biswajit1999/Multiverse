<text x="210" y="420" font-family="Arial" font-size="13">reheating</text>
<text x="415" y="420" font-family="Arial" font-size="13">thermalized bubble</text>
<text x="760" y="420" font-family="Arial" font-size="13">bounce / transition</text>
