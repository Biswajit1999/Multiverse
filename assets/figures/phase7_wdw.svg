<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650">
<rect width="1100" height="650" fill="white"/>
<text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700">Wheeler-DeWitt minisuperspace benchmark</text>
<text x="550" y="75" text-anchor="middle" font-family="Arial" font-size="14">Dimensionless closed de-Sitter toy potential U(a)=a^2-lambda a^4 for lambda=0.2</text>
<line x1="95" y1="520" x2="1000" y2="520" stroke="#222" stroke-width="2"/>
<line x1="95" y1="110" x2="95" y2="520" stroke="#222" stroke-width="2"/>
<path d="M95 520 C185 490,275 400,365 285 C450 180,520 150,585 220 C650 295,710 430,760 520 C820 625,920 720,1000 760" fill="none" stroke="#222" stroke-width="4"/>
<line x1="585" y1="110" x2="585" y2="520" stroke="#777" stroke-dasharray="9 7" stroke-width="2"/>
<text x="595" y="135" font-family="Arial" font-size="13">turning point a_t=lambda^(-1/2)</text>
<path d="M96 520 C195 500,290 465,385 425 C475 390,540 370,585 365" fill="none" stroke="#999" stroke-width="16" opacity=".25"/>
<text x="315" y="365" font-family="Arial" font-size="14">WKB barrier region</text>
<text x="550" y="585" text-anchor="middle" font-family="Arial" font-size="15">scale factor a</text>
<text x="30" y="330" transform="rotate(-90 30 330)" text-anchor="middle" font-family="Arial" font-size="15">U(a)</text>
<text x="795" y="180" font-family="Arial" font-size="16" font-weight="700">Analytic check</text>
<text x="795" y="215" font-family="Arial" font-size="15">I = integral sqrt(U) da = 1/(3 lambda)</text>
<text x="795" y="250" font-family="Arial" font-size="15">lambda = 0.2 gives I = 1.666666...</text>
<text x="795" y="300" font-family="Arial" font-size="12">Boundary prescriptions are not</text>
<text x="795" y="320" font-family="Arial" font-size="12">treated as measured probabilities.</text>
</svg>