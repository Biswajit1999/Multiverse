<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200"><rect width="1800" height="1200" fill="#fffdf8"/><text x="90" y="95" font-family="Georgia,serif" font-size="58" fill="#121826">Inflation in the light of observations</text><text x="90" y="145" font-family="Arial,sans-serif" font-size="24" fill="#667085">The tensor prediction sharply separates simple quadratic and low-r plateau models.</text><g transform="translate(150 240)"><rect width="1080" height="700" fill="#fff" stroke="#cfd3db" stroke-width="3"/><g stroke="#e6e8ed" stroke-width="2"><line x1="0" y1="140" x2="1080" y2="140"/><line x1="0" y1="280" x2="1080" y2="280"/><line x1="0" y1="420" x2="1080" y2="420"/><line x1="0" y1="560" x2="1080" y2="560"/><line x1="216" y1="0" x2="216" y2="700"/><line x1="432" y1="0" x2="432" y2="700"/><line x1="648" y1="0" x2="648" y2="700"/><line x1="864" y1="0" x2="864" y2="700"/></g><rect x="535" y="558" width="175" height="142" fill="#e8eeff"/><ellipse cx="620" cy="615" rx="118" ry="66" fill="#9fb1ec" opacity=".45"/><line x1="0" y1="568" x2="1080" y2="568" stroke="#d78a20" stroke-width="4" stroke-dasharray="14 12"/><path d="M390 185C460 240 520 300 610 382" fill="none" stroke="#c94b45" stroke-width="8"/><circle cx="395" cy="187" r="12" fill="#c94b45"/><path d="M500 635C560 642 620 647 710 652" fill="none" stroke="#1a8ca4" stroke-width="8"/><circle cx="625" cy="647" r="12" fill="#1a8ca4"/><text x="85" y="165" font-family="Arial" font-size="26" font-weight="700" fill="#c94b45">Quadratic φ²</text><text x="720" y="630" font-family="Arial" font-size="26" font-weight="700" fill="#1a8ca4">Plateau</text><text x="470" y="770" font-family="Georgia" font-size="30" fill="#121826">scalar spectral index nₛ</text><text x="-450" y="-95" transform="rotate(-90)" font-family="Georgia" font-size="30" fill="#121826">tensor-to-scalar ratio r</text></g><g transform="translate(1295 270)" font-family="Arial,sans-serif"><rect width="410" height="600" rx="24" fill="#f2f4f8" stroke="#d2d6de" stroke-width="3"/><text x="32" y="58" font-size="26" font-weight="700" fill="#121826">N = 60 benchmark</text><text x="32" y="112" font-size="20" fill="#667085">Quadratic inflation</text><text x="32" y="145" font-size="26" font-weight="700" fill="#c94b45">nₛ ≈ 0.96694</text><text x="32" y="182" font-size="26" font-weight="700" fill="#c94b45">r ≈ 0.13223</text><line x1="32" y1="220" x2="378" y2="220" stroke="#d4d8df" stroke-width="2"/><text x="32" y="270" font-size="20" fill="#667085">Plateau / Starobinsky</text><text x="32" y="303" font-size="26" font-weight="700" fill="#1a8ca4">nₛ ≈ 0.96783</text><text x="32" y="340" font-size="26" font-weight="700" fill="#1a8ca4">r ≈ 0.002964</text><line x1="32" y1="378" x2="378" y2="378" stroke="#d4d8df" stroke-width="2"/><text x="32" y="426" font-size="20" fill="#667085">Compressed benchmark</text><text x="32" y="462" font-size="24" font-weight="700" fill="#d78a20">r &lt; 0.034</text></g></svg>